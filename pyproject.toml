[project]
name = "gsop"
version = "0.1.0"
description = "Geospatial Similarity Observation Platform: simulation engine"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
  "numpy", "pandas", "pyarrow", "scipy", "scikit-learn", "rasterio", "pyproj",
  "shapely", "psutil", "pyyaml", "typer", "rich", "tqdm", "requests",
  "earthengine-api", "pytest",
]

[project.scripts]
gsop = "gsop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
