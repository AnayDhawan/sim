  ladakh_puga:         {lat: 33.22,  lon: 78.32,   bodies: [mars],       confirmed: false}
  mdrs_utah:           {lat: 38.41,  lon: -110.79, bodies: [mars],       confirmed: false}
secondary:    # in the novelty exclusion list and sensitivity checks, not in the pass criterion
