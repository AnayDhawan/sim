  amazon_basin:        {lat: -3.0,   lon: -60.0,   confirmed: false}
  congo_basin:         {lat: -0.5,   lon: 23.0,    confirmed: false}
# Pre-registered pass criteria. Written into validation.json before anything is computed. Do not tune weights to pass.
criteria:
  primary_median_rank_pct_min: 90
  negative_control_rank_pct_max: 25
  gate_tests_all_rejected: true
