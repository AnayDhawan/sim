# Feature columns and sources. Earth sources are LEADS TO VERIFY, not facts (see docs/UNVERIFIED.md).
# Terrain operator: one numpy operator (src/gsop/operators.py) on Earth, Moon and Mars.
operator:
  slope_baseline_m: 500            # slope is computed on a 500 m mean-resampled DEM (Horn 3x3), then reduced to the tile
  rough_a_baseline_m: 100          # TODO confirm with Vihaan
  rough_b_baseline_m: 1000         # TODO confirm with Vihaan
  tile_m: 6000
  work_cell_m: 25                  # working grid of the Earth Engine export and of `check-operators`: DEM resampled bilinearly to this cell, so 100 m and 1000 m divide it (100/30 does not)
  stride_m: 3000                   # target windows only
sun_low_threshold_deg: 5           # sun_low_share = share of daylight with the Sun under this elevation
# Earth solar geometry (src/gsop/earth/solar.py): latitude and obliquity only, flat horizon, circular orbit. DEVIATION from
# SPEC section 3, which also names slope and aspect. Sampling: n_days values of solar longitude, n_hours hour angles per day.
solar: {obliquity_deg: 23.44, s0_w_m2: 1361.0, n_days: 365, n_hours: 288}
# Earth standard atmosphere, troposphere (NASA Glenn metric model, https://www.grc.nasa.gov/www/k-12/airplane/atmosmet.html):
#   T = t0_c - lapse_c_per_m * h; p = p0_kpa * ((T + kelvin) / t_ref_k) ** exponent; rho = p / (gas_const * (T + kelvin)).
earth_atmosphere: {t0_c: 15.04, lapse_c_per_m: 0.00649, p0_kpa: 101.29, t_ref_k: 288.08, exponent: 5.256,
                   gas_const: 0.2869, kelvin: 273.1, valid_to_m: 11000}
# 0/1 flags exported next to the features. A flag is never a feature and never enters the score.
flags:
  ti_is_fallback: "1 where ti_proxy used the annual mean day-night swing because no precipitation-based dry season was available"
columns:
  slope_med:  {unit: deg, what: "median slope over the tile at the shared 500 m baseline", earth: "NASADEM (SRTM) 56S to 60N; Copernicus DEM GLO-30 above 60N (lead)", moon: "LOLA", mars: "MOLA"}
  slope_p90:  {unit: deg, what: "90th percentile slope over the tile", earth: "as slope_med", moon: "LOLA", mars: "MOLA"}
  relief:     {unit: m, what: "elevation range (max-min of 500 m cells) in the tile", earth: "as slope_med", moon: "LOLA", mars: "MOLA"}
  rough_a:    {unit: m, what: "RMS height after plane removal, short baseline", earth: "as slope_med", moon: "LOLA", mars: "MOLA"}
  rough_b:    {unit: m, what: "RMS height after plane removal, long baseline", earth: "as slope_med", moon: "LOLA", mars: "MOLA"}
  sun_max_elev: {unit: deg, what: "maximum Sun elevation over the year, from latitude, obliquity, slope and aspect", earth: "computed", moon: "computed; pole targets about 1.5 deg", mars: "computed"}
  sun_low_share: {unit: fraction, what: "share of daylight with the Sun under 5 deg", earth: "computed", moon: "pole targets about 1.0", mars: "computed"}
  insol_annual: {unit: W/m2, what: "annual mean insolation", earth: "computed", moon: "n/a", mars: "computed"}
  t_mean:     {unit: K, what: "annual mean surface temperature", earth: "MODIS LST 2015-2024 climatology (lead)", moon: "Diviner (not at the pole; flag)", mars: "climate data"}
  t_coldest:  {unit: K, what: "coldest-month surface temperature", earth: "MODIS LST (lead)", moon: "Diviner (not at the pole; flag)", mars: "climate data"}
  ti_proxy:   {unit: K, what: "day-night temperature swing in the dry season (three driest consecutive months; fall back to annual median and flag)", earth: "MODIS (lead)", moon: "Diviner", mars: "THEMIS"}
  dust_index: {unit: "0-1", what: "Mars only; shares the thermal_inertia weight", earth: "MERRA-2 dust or MODIS aerosol (lead)", mars: "TES albedo / dust cover"}
  water_index: {unit: "0-1", what: "WEAK cross-instrument proxy", earth: "mean of permafrost probability and a 0-1 aridity index (lead: GPM, SMAP)", moon: "PSR share of the tile", mars: "SWIM ice consistency"}
  silica_index: {unit: ratio, what: "WEAK cross-instrument proxy; thermal-infrared emissivity band ratio", earth: "ASTER GED (EMIT only where available)", moon: "Diviner Christiansen feature", mars: "TES"}
  air_density: {unit: kg/m3, what: "Mars family only; standard atmosphere from elevation on Earth, exponential pressure law on Mars", earth: "standard atmosphere", mars: "exponential law, constants TODO unsourced"}
gate_layers:
  water_ice_frac: "open water or permanent ice fraction of the tile"
  ndvi_median: "MODIS NDVI median"
  built_crop_frac: "built-up or cropland fraction (land-cover product)"
# Sigma rule: sigma_k = max(target_spread_k, measurement_uncertainty_k, 0.25 * IQR_of_k_across_all_gated_Earth_tiles).
# null = no sourced value, so the IQR term (and the target spread) alone applies. TODO marks a value a human must supply.
measurement_uncertainty:
  moon:
    # Source (opened 2026-11-13): Barker et al. 2021, Planet. Space Sci. 203:105119, https://ntrs.nasa.gov/citations/20205009660 :
    # "The LDEM surface height and slope uncertainties have typical RMS values of ~0.30-0.50 m and ~1.5-2.5 deg". The paper gives
    # ONE range for the four south-pole sites (5 m/pixel LDEMs), not per-site values. The values below are the MIDPOINTS of those
    # ranges, which is a choice (the upper ends 2.5 deg and 0.5 m would be the conservative alternative). They are also an
    # extrapolation: the figures are for 5 m pixels, and no source gives the error at the 500 m baseline this project uses.
    slope_med: 2.0      # midpoint of 1.5-2.5 deg (choice, see above)
    slope_p90: 2.0      # same
    relief: 0.4         # midpoint of 0.3-0.5 m (choice, see above). Never binds: 0.25 * IQR is far larger
    # Other bodies and columns have NO value on purpose. Sourced candidates, and why none was applied, are in docs/UNCERTAINTY_SOURCES.md.
  mars: {}
earth_uncertainty: {}   # systematic Earth bias per column. Empty: none sourced yet (TODO)
